name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Babushka_VST3 Babushka_Standalone babushka_render --parallel
      - name: DSP tests
        run: |
          mkdir out
          build/Release/babushka_render.exe out
      - uses: actions/upload-artifact@v4
        with:
          name: Babushka-Windows-VST3
          path: build/Babushka_artefacts/Release/VST3/Babushka.vst3

  macos-vst3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target Babushka_VST3 Babushka_Standalone --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Babushka-macOS-VST3
          path: build/Babushka_artefacts/Release/VST3/Babushka.vst3
